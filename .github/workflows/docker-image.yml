name: Docker Build and Deploy - fuenex_landing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DOCKER_IMAGE: "fuenex_landing"
  DEPLOY_DIR: "/root/fuenex_landing"
  CONTAINER_NAME: "fuenex_landing"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Получение кода
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Установка Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Шаг 3: Сборка Docker-образа
      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .

      # Шаг 4: Сохранение образа в сжатый tar.gz для быстрой передачи
      - name: Save and compress Docker image
        run: |
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > ${{ env.DOCKER_IMAGE }}.tar.gz

      # Шаг 5: Копирование файлов на удаленный сервер
      - name: Copy files to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.DOCKER_IMAGE }}.tar.gz,docker-compose.yml"
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true

      # Шаг 6: Развертывание и проверка на сервере
      - name: Deploy and Verify on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Переходим в папку деплоя или создаем ее, если она отсутствует
            mkdir -p ${{ env.DEPLOY_DIR }}
            cd ${{ env.DEPLOY_DIR }}

            # 1. Проверяем наличие необходимых файлов
            if [ ! -f "${{ env.DOCKER_IMAGE }}.tar.gz" ] || [ ! -f "docker-compose.yml" ]; then
              echo "Error: Required files not found!"
              exit 1
            fi

            # 2. Распаковываем и загружаем образ в локальный Docker
            gunzip -c ${{ env.DOCKER_IMAGE }}.tar.gz | docker load

            # 3. Перезапускаем контейнеры с помощью современного Docker Compose v2
            # Если на сервере установлен только старый docker-compose, замените на "docker-compose"
            docker compose down || true
            docker compose up -d

            # 4. Очистка временных файлов архива и неиспользуемых образов
            rm ${{ env.DOCKER_IMAGE }}.tar.gz
            docker image prune -f

            # 5. Проверка статуса запущенного контейнера
            echo "=== Container Status ==="
            docker ps | grep ${{ env.CONTAINER_NAME }} || echo "Container is not running!"