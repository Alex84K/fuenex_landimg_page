name: Docker Build and Deploy - Production

on:
  push:
    branches: ["production"]
  # Pull request на продакшен обычно не делают напрямую, но если нужно, можно оставить:
  # pull_request:
  #   branches: ["production"]

env:
  DOCKER_IMAGE: "fliesenflow_landing"
  DEPLOY_DIR: "/root/fliesenflow_landing" # Можете указать другой путь, если нужно
  CONTAINER_NAME: "fliesenflow_landing"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .

      - name: Save and compress Docker image
        run: |
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > ${{ env.DOCKER_IMAGE }}.tar.gz

      # Копируем на ПРОДАКШЕН сервер (используем PROD_ секреты)
      - name: Copy files to remote production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FUENEX_SERVER_IP }}
          username: ${{ secrets.FUENEX_SERVER_USER }}
          key: ${{ secrets.FUENEX_SSH_PRIVATE_KEY }}
          source: "${{ env.DOCKER_IMAGE }}.tar.gz,docker-compose.yml"
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true

      # Деплой на ПРОДАКШЕН сервер
      - name: Deploy and Verify on Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FUENEX_SERVER_IP }}
          username: ${{ secrets.FUENEX_SERVER_USER }}
          key: ${{ secrets.FUENEX_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.DEPLOY_DIR }}
            cd ${{ env.DEPLOY_DIR }}

            if [ ! -f "${{ env.DOCKER_IMAGE }}.tar.gz" ] || [ ! -f "docker-compose.yml" ]; then
              echo "Error: Required files not found!"
              exit 1
            fi

            gunzip -c ${{ env.DOCKER_IMAGE }}.tar.gz | docker load

            docker compose down || true
            docker compose up -d

            rm ${{ env.DOCKER_IMAGE }}.tar.gz
            docker image prune -f

            echo "=== Production Container Status ==="
            docker ps | grep ${{ env.CONTAINER_NAME }} || echo "Container is not running!"